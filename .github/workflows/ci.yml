name: Quality

on:
  pull_request:
    # PLAN-SFC-V1 Q17: reviewed implementation PRs stage on the nondeployed integration branch, so the
    # same checks cover them as cover main.
    branches: [main, codex/sfc-integration]
  # Manual trigger: bootstraps a PR whose own workflow change is not yet on its base branch, run at the
  # PR's immutable head (docs/testing/playwright.md, "Continuous integration").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A QA candidate (commercial release id or live-policy patch) is never deployable: reject the marker
      # and any unrestored candidate before the rest of validation.
      - run: node scripts/prepare-sfc-candidate.mjs verify-clean
      - run: npm run validate
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  browser:
    runs-on: ubuntu-latest
    # The single browser job took 51m59s over 2749 cases (PR #141, run 38623461245). PLAN-SFC-V1 splits the
    # same cases across four shards of two workers each: target 25 minutes per shard, hard limit 35. Measure
    # the real duration of each shard at every wave; never raise the limit to hide a failure, and never drop
    # unique coverage. Per-test, hook and expect timeouts are unchanged.
    timeout-minutes: 35
    strategy:
      # A failing shard must not cancel its siblings: every shard's evidence is needed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Official prebuilt Playwright image: browsers and system libraries come with it, so the job no longer
    # installs them over the network on every run. The tag MUST equal the locked `@playwright/test` version
    # (package.json); change both together. Options follow the Playwright CI and Docker guides:
    # --user 1001 is the GitHub runner user (workspace files stay writable and uploadable),
    # --init reaps zombie processes, --ipc=host avoids Chromium shared-memory crashes.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=2
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Uploaded whether the shard passed or failed, under a name unique to the run, attempt and shard.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
    # The dedicated candidate job (commercial and new-route runtime cases against the QA patches, restored in
    # an always-run cleanup step) is added by PLAN-SFC-V1 Task 10, when the first implemented cases exist.
