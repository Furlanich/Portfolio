name: Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  browser:
    runs-on: ubuntu-latest
    # Full matrix took 34 minutes in PR #122; reserve time for setup, evidence and cache cleanup.
    # Overall resource budget only. Per-test, hook and expect timeouts are unchanged.
    timeout-minutes: 45
    # Official prebuilt Playwright image: browsers and system libraries come with it, so the job no longer
    # installs them over the network on every run. The tag MUST equal the locked `@playwright/test` version
    # (package.json); change both together. Options follow the Playwright CI and Docker guides:
    # --user 1001 is the GitHub runner user (workspace files stay writable and uploadable),
    # --init reaps zombie processes, --ipc=host avoids Chromium shared-memory crashes.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
