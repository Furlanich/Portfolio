name: Quality

on:
  pull_request:
    # PLAN-SFC-V1 Q17: reviewed implementation PRs stage on the nondeployed integration branch, so the
    # same checks cover them as cover main.
    branches: [main, codex/sfc-integration]
  # Manual trigger: bootstraps a PR whose own workflow change is not yet on its base branch, run at the
  # PR's immutable head (docs/testing/playwright.md, "Continuous integration").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A QA candidate (commercial release id or live-policy patch) is never deployable: reject the marker
      # and any unrestored candidate before the rest of validation.
      - run: node scripts/prepare-sfc-candidate.mjs verify-clean
      - run: npm run validate
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  browser:
    runs-on: ubuntu-latest
    # The single browser job took 51m59s over 2749 cases (PR #141, run 38623461245). PLAN-SFC-V1 splits the
    # same cases across four shards of two workers each: target 25 minutes per shard, hard limit 35. Measure
    # the real duration of each shard at every wave; never raise the limit to hide a failure, and never drop
    # unique coverage. Per-test, hook and expect timeouts are unchanged.
    timeout-minutes: 35
    strategy:
      # A failing shard must not cancel its siblings: every shard's evidence is needed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Official prebuilt Playwright image: browsers and system libraries come with it, so the job no longer
    # installs them over the network on every run. The tag MUST equal the locked `@playwright/test` version
    # (package.json); change both together. Options follow the Playwright CI and Docker guides:
    # --user 1001 is the GitHub runner user (workspace files stay writable and uploadable),
    # --init reaps zombie processes, --ipc=host avoids Chromium shared-memory crashes.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=2
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Uploaded whether the shard passed or failed, under a name unique to the run, attempt and shard.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # PLAN-SFC-V1 Task 26: the dedicated candidate job. The commercial-inquiry and new-route runtime families
  # only exist with SFC_TEST_MODE=candidate and only make sense against the QA candidate patches, so they never
  # ran in the sharded `browser` job above. This job applies both patches to its own disposable checkout
  # (every job checks out fresh), runs the 90 candidate cases, and ALWAYS restores. A candidate is never
  # deployable: this job builds and publishes nothing, holds no secret, keeps the workflow's read-only token,
  # and the `validate` job rejects any QA marker or unrestored candidate in the tree it checks.
  # Budget: target 20 minutes, hard limit 30. Never extend it, drop a case or weaken a test to hide a failure;
  # measure the real duration at each wave (docs/testing/playwright.md, "Continuous integration").
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same prebuilt Playwright image and options as `browser`. The extra --add-host entries point the
    # inquiry provider at loopback, so an unmocked request to it cannot leave the container: it fails to
    # connect instead of reaching the real endpoint. The tag MUST equal the locked `@playwright/test` version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: >-
        --user 1001 --init --ipc=host
        --add-host formspree.io:127.0.0.1
        --add-host www.formspree.io:127.0.0.1
    env:
      # Selects the test families only. The application's own mode comes from the applied patches.
      SFC_TEST_MODE: candidate
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Resolved in getaddrinfo order, as the browser does: `getent hosts` would print an IPv4-mapped address.
      - name: Prove provider traffic is blocked
        run: |
          for host in formspree.io www.formspree.io; do
            addresses=$(getent ahosts "$host" | awk '{ print $1 }' | sort -u)
            [ "$addresses" = "127.0.0.1" ] || { echo "$host resolves to: $addresses"; exit 1; }
          done
      - name: Start from a clean tree
        run: node scripts/prepare-sfc-candidate.mjs verify-clean
      - name: Apply the commercial and live-policy candidates
        run: node scripts/prepare-sfc-candidate.mjs apply --kind=combined --expect-head=${{ github.sha }}
      - name: Run the candidate families
        run: npx playwright test --workers=2
      # Runs whether the cases passed, failed or were cancelled. It restores only when a candidate is still
      # applied, then proves the checkout is clean either way.
      - name: Restore the candidate
        if: always()
        run: |
          if ! node scripts/prepare-sfc-candidate.mjs verify-clean; then
            node scripts/prepare-sfc-candidate.mjs restore --kind=combined
          fi
          node scripts/prepare-sfc-candidate.mjs verify-clean
      # Uploaded whether the cases passed or failed, under a name unique to the run and attempt.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
